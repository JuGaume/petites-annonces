name: Deploy

# Se déclenche sur push vers main, en plus d'un déclenchement manuel (utile pour
# rejouer un déploiement sans nouveau commit). Chaque job est gardé par la présence
# du secret correspondant : tant que l'infra Azure n'est pas provisionnée et les
# secrets GitHub pas renseignés (voir README, section « CI/CD et déploiement
# Azure »), les jobs sont simplement ignorés plutôt que d'échouer à chaque push.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-api:
    name: API (migrations + déploiement)
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_WEBAPP_NAME != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore
        working-directory: api

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: api

      - name: Test
        run: dotnet test --no-build -c Release
        working-directory: api

      - name: Appliquer les migrations EF Core
        # Contre la base Azure SQL de production, avant de déployer le nouveau code
        # — dotnet-ef n'est pas préinstallé sur le runner.
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef database update \
            --project PetitesAnnonces.Api \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"
        working-directory: api

      - name: Publier
        run: dotnet publish PetitesAnnonces.Api -c Release -o ../publish
        working-directory: api

      - name: Déployer sur Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: api/publish

  deploy-web:
    name: Front (build + déploiement Static Web App)
    runs-on: ubuntu-latest
    if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur Azure Static Web Apps
        # L'action gère elle-même install + build (Oryx) : les variables VITE_* sont
        # des constantes injectées à la compilation (Vite), pas de la config runtime,
        # elles doivent donc être présentes à cette étape.
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: dist
          app_build_command: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
