<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffbf0" />
    <!-- Application privée, réservée aux membres connectés : contenu non destiné à
         l'indexation (spec §10, SEO — seule la landing publique doit l'être). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Petites annonces</title>
    <script>
      // Pose data-theme sur <html> avant le premier paint pour éviter un flash du
      // mauvais thème : choix mémorisé (localStorage) sinon préférence système, une
      // seule fois au chargement. La bascule manuelle vit dans ThemeContext.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
